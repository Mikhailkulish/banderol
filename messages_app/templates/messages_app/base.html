{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Сообщения Ban de Rol{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>
<body>

<div class="container-fluid">
    <div class="row align-items-center mb-3 border-bottom">
        <div class="col-9">
            <div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 bg-white  box-shadow">
                <h5 class="my-0 mr-md-auto font-weight-normal">Ban de Rol</h5>
                {% include 'recipients/includes/inc_menu.html' %}
            </div>
        </div>

        <div class="col-3 d-flex align-items-center justify-content-center h-100">
            <div class="dropdown">
                <button class="btn btn-sm btn-outline-dark dropdown-toggle d-flex align-items-center"
                        type="button" data-bs-toggle="dropdown" aria-expanded="false">
                </button>
            </div>
        </div>

    </div>
</div>

<div class="container">
    {% include 'messages_app/includes/header.html' %}
    {% block content %}{% endblock %}
</div>

<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
