{% extends 'messages_app/base.html' %}
{% block title %}Сообщения Ban de Rol{% endblock %}
{% block content %}
<div class="container">
    <div class="row">
        <div class="col-6">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <p class="card-text text-center text-danger fw-bold mt-3">Вы действительно хотите удалить сообщение?</p>
                    <div class="card-body">
                        {% csrf_token %}
                    </div>
                    <div class="d-flex gap-2 px-3 pb-3 justify-content-center">
                        <button type="submit" class="btn btn-outline-danger">Удалить</button>
                        <a class="btn btn-outline-primary" href="{% url 'messages_app:message_list' %}" role="button">Отменить</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
