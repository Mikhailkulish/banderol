{% extends 'main/base.html' %}
{% block title %}Регистрация в Ban de Rol{% endblock %}
{% block content %}
<div class="container">
    <div class="row">
        <div class="col-6">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <div class="card-body">
                        {% csrf_token %}
                        {{ form.as_p }}
                    </div>
                    <button type="submit" class="btn btn-primary">
                        Войти
                    </button>
                    <div class="mt-3 text-center">
                        <a href="{% url 'users:password_reset' %}">Забыли пароль?</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
