{% extends 'main/base.html' %}
{% block content %}
  <h2>Новый пароль</h2>
  {% if validlink %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Сохранить пароль</button>
    </form>
  {% else %}
    <p class="text-danger">Ссылка недействительна или устарела. Запросите сброс заново.</p>
  {% endif %}
{% endblock %}
